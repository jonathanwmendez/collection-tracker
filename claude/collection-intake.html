<title>Collection Intake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>

/* One phone-first column. Colors match the Collection Tracker web app. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#16202E; --muted:#5B6575; --line:#DCE1E8;
  --primary:#1F3864; --primary-ink:#FFFFFF; --primary-soft:#E4EAF5; --link:#1F3864;
  --clay:#D97757; --clay-soft:#F9E4DC; --clay-ink:#8A3B22;
  --ok:#2F7D4F; --ok-soft:#E3F2E8; --warn:#8A5D00; --warn-soft:#FBF0D3; --bad:#B3261E; --bad-soft:#FBE3E1;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#18202B; --ink:#E7EBF1; --muted:#9AA4B2; --line:#2A3442;
  --primary:#4A6FB5; --primary-ink:#FFFFFF; --primary-soft:#1E2A40; --link:#9DB6E8;
  --clay:#E08A6D; --clay-soft:#3A241C; --clay-ink:#F2B49C;
  --ok:#6CC28F; --ok-soft:#17301F; --warn:#E2B54D; --warn-soft:#33290F; --bad:#F28B82; --bad-soft:#3A1A18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#18202B; --ink:#E7EBF1; --muted:#9AA4B2; --line:#2A3442;
  --primary:#4A6FB5; --primary-ink:#FFFFFF; --primary-soft:#1E2A40; --link:#9DB6E8;
  --clay:#E08A6D; --clay-soft:#3A241C; --clay-ink:#F2B49C;
  --ok:#6CC28F; --ok-soft:#17301F; --warn:#E2B54D; --warn-soft:#33290F; --bad:#F28B82; --bad-soft:#3A1A18;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:560px;min-height:100dvh;justify-content:center;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{text-align:center}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.intro{margin:6px auto 0;color:var(--muted);font-size:14px;max-width:44ch}
a{color:var(--link);text-underline-offset:2px}
button{font:inherit;font-weight:500;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px;cursor:pointer}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ghost{background:transparent;border-color:transparent;color:var(--link);text-decoration:underline;text-underline-offset:2px;font-weight:400}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hero .primary{font-size:18px;min-height:56px;padding:14px 28px;width:min(100%,320px)}
.hero p{margin:0;color:var(--muted);font-size:13px;max-width:40ch}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.banner[data-kind="ok"]{background:var(--ok-soft);color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--primary-soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:500;border-radius:999px;padding:1px 7px;background:rgba(0,0,0,.6);color:#fff}
.ph.up span{background:var(--clay)}
.ph.fail{outline:2px solid var(--bad)}
.ph.fail span{background:var(--bad)}
.ph button{position:absolute;inset:0;width:100%;height:100%;opacity:0;min-height:0}
.err{font-size:14px;color:var(--bad);margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:12px max(16px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.bar[hidden]{display:none}
.bar .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .count{font-size:14px;color:var(--muted)}
.bar .count b{color:var(--ink);font-weight:500}
.bar .acts{display:flex;gap:8px}
.bar .acts .primary{flex:1;font-size:16px;min-height:52px}
body.shooting .wrap{padding-bottom:150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap">
  <header>
    <h1>Collection Intake</h1>
    <p class="intro">Take photos. Tonight, Claude identifies each item, pairs card fronts with backs, saves them to your sheet, and prices them. <a href="https://docs.google.com/spreadsheets/d/{{SHEET_ID}}/edit" target="_blank" rel="noopener">Open the sheet</a></p>
  </header>

  <div id="banners"></div>

  <section class="hero" aria-label="Add photos">
    <button class="primary" id="shoot" type="button">Take photos</button>
    <button class="ghost" id="pick" type="button">Choose from library</button>
    <p>For a card, take the front, then the back. A binder page or several items in one photo works too.</p>
    <input id="cam" class="sr" type="file" accept="image/*" capture="environment">
    <input id="file" class="sr" type="file" accept="image/*" multiple>
  </section>

  <section id="sent" hidden aria-live="polite" style="display:flex;flex-direction:column;gap:10px">
    <div class="grid" id="grid"></div>
    <p class="err" id="err" hidden></p>
  </section>
</div>

<div class="bar" id="bar" hidden role="region" aria-label="Photos">
  <div class="in">
    <div class="count" id="count"></div>
    <div class="acts">
      <button class="primary" id="more" type="button">Take another</button>
      <button id="done" type="button">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
const INBOX = "{{INBOX_FOLDER_ID}}";

// ---------- tiny DOM helper ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

// ---------- banners ----------
function banner(text, kind){
  const box = document.getElementById("banners");
  box.replaceChildren(h("div", {class:"banner", "data-kind":kind || ""}, text));
}

let mcp = null, fileArgs = false;
(async () => {
  mcp = await claude.use("mcp");
  if (!mcp){ banner("Photos can't be uploaded from this view. Open this page in the Claude app or on claude.ai."); return; }
  const lt = await mcp.listTools().catch(() => null);
  fileArgs = !!lt?.fileArgs;
})();

// ---------- error copy ----------
function mcpWhy(e){
  const s = e?.server || "the connector";
  switch (e?.code){
    case "needs_reauth": return `Reconnect ${s} in claude.ai Settings → Connectors, then try again.`;
    case "server_not_connected": return `Add the ${s} connector in claude.ai Settings → Connectors, then try again.`;
    case "selection_required": return `Choose which ${s} account to use when claude.ai asks, then try again.`;
    case "approval_required": case "not_in_manifest": return `This page needs your OK to use ${s}. Try again and allow it.`;
    case "blocked_by_policy": return `Your organization blocks this ${s} action.`;
    case "server_unavailable": return `${s} isn't responding right now. Wait a minute and try again.`;
    case "tool_error": return `${s} reported a problem: ${String(e.message || "").slice(0, 180)}`;
    case "not_granted": case "capability_disabled": case "capability_removed": return "Connectors aren't available in this view. Open the page in the Claude app or on claude.ai.";
    default: return `${s} didn't finish (${e?.code || "unknown error"}). Check the sheet before trying again.`;
  }
}
// ---------- images ----------
// Applies the camera's rotation tag (so the saved file is upright everywhere), then any extra turn from the Rotate button.
async function toJpeg(file, maxSide, quality, rot = 0){
  let src;
  try { src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, hgt = src.height, k = Math.min(1, maxSide / Math.max(w, hgt));
  const sw = Math.round(w * k), sh = Math.round(hgt * k);
  const turn = ((rot % 360) + 360) % 360, sideways = turn === 90 || turn === 270;
  const c = document.createElement("canvas"); c.width = sideways ? sh : sw; c.height = sideways ? sw : sh;
  const g = c.getContext("2d");
  g.translate(c.width / 2, c.height / 2); g.rotate(turn * Math.PI / 180);
  g.drawImage(src, -sw / 2, -sh / 2, sw, sh);
  return await new Promise(r => c.toBlob(r, "image/jpeg", quality));
}
function toBase64(blob){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
}

// ---------- photos ----------
// Each photo is named with when this session started plus a running number, so the
// background task sees them in the order they were taken (a card's front, then its back).
const pad = n => String(n).padStart(3, "0");
const sessionStamp = (() => { const d = new Date(), z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}`; })();
let seq = 0, uploaded = 0, doneAsked = false;
const photos = [];

const cam = document.getElementById("cam"), lib = document.getElementById("file");
document.getElementById("shoot").onclick = () => cam.click();
document.getElementById("more").onclick = () => cam.click();
document.getElementById("pick").onclick = () => lib.click();
cam.onchange = () => { add([...cam.files]); cam.value = ""; };
lib.onchange = () => { add([...lib.files].sort((a, b) => a.lastModified - b.lastModified)); lib.value = ""; };
document.getElementById("done").onclick = () => finish(true);

function add(files){
  for (const f of files){
    if (!f.type.startsWith("image/")) continue;
    const p = {file: f, n: ++seq, state: "up", el: null};
    photos.push(p); draw(p); queue.push(p);
  }
  document.getElementById("sent").hidden = false;
  showBar(); pump();
}

function draw(p){
  const label = p.state === "up" ? "Uploading" : p.state === "fail" ? "Tap to retry" : "Sent";
  const el = h("div", {class: "ph " + (p.state === "up" ? "up" : p.state === "fail" ? "fail" : "")},
    h("img", {src: (p.file._url ||= URL.createObjectURL(p.file)), alt: `Photo ${p.n}`}), h("span", {}, label),
    p.state === "fail" ? h("button", {type:"button", "aria-label": `Retry photo ${p.n}`, onclick: () => { p.state = "up"; draw(p); queue.push(p); pump(); }}) : null);
  if (p.el) p.el.replaceWith(el); else document.getElementById("grid").append(el);
  p.el = el;
}

const queue = []; let active = 0;
function pump(){
  while (active < 2 && queue.length){ active++; upload(queue.shift()).finally(() => { active--; pump(); settle(); }); }
}

async function upload(p){
  const err = document.getElementById("err");
  if (!mcp){ p.state = "fail"; draw(p); err.hidden = false; err.textContent = "Uploading isn't available in this view. Open this page in the Claude app or on claude.ai."; return; }
  try {
    const title = `${sessionStamp} ${pad(p.n)}.jpg`;
    let content;
    if (fileArgs){ content = {$file: {data: await toJpeg(p.file, 2000, 0.88), name: title, type: "image/jpeg"}}; }
    else {
      let blob = await toJpeg(p.file, 1600, 0.82);
      if (blob.size > 700000) blob = await toJpeg(p.file, 1200, 0.75);
      content = await toBase64(blob);
    }
    await mcp.callTool("Google Drive", "create_file",
      {title, parentId: INBOX, contentMimeType: "image/jpeg", disableConversionToGoogleType: true, base64Content: content});
    p.state = "ok"; uploaded++; err.hidden = true;
  } catch (e){
    p.state = "fail"; err.hidden = false;
    err.textContent = e?.code ? mcpWhy(e) : "A photo couldn't be prepared. Try it again or take a new one.";
  }
  draw(p); showBar();
}

function showBar(){
  const busy = photos.filter(p => p.state === "up").length, failed = photos.filter(p => p.state === "fail").length;
  document.getElementById("bar").hidden = !photos.length; document.body.classList.toggle("shooting", photos.length > 0);
  const parts = [`<b>${uploaded} photo${uploaded === 1 ? "" : "s"} sent</b>`];
  if (busy) parts.push(`${busy} uploading`);
  if (failed) parts.push(`${failed} failed`);
  document.getElementById("count").innerHTML = parts.join(" · ");
}

// Nothing runs now: the nightly task (3:30 AM) turns the inbox photos into rows, then prices them.
function settle(){ if (doneAsked && !photos.some(p => p.state === "up")) finish(true); }
function finish(tapped){
  if (photos.some(p => p.state === "up")){ doneAsked = true; banner("Still uploading. Keep this page open until the last photo is sent."); return; }
  doneAsked = false;
  if (tapped) done();
  if (uploaded) banner(`${uploaded} photo${uploaded === 1 ? "" : "s"} saved. Claude adds and prices them tonight at 3:30 AM.`, "ok");
}
function done(){
  document.getElementById("bar").hidden = true; document.body.classList.remove("shooting");
}
})();
</script>
